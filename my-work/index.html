<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Work - Josiah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/fontawesome.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/solid.min.css">
<style>
:root{--bg:#f7f8f5;--fg:#1a1c19;--muted:#71766f;--line:#dfe3dc;--accent:#2d6a4f}
@media (prefers-color-scheme:dark){:root{--bg:#121412;--fg:#e8ece6;--muted:#949a92;--line:#2a2e2a;--accent:#74c69d}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;text-align:center;padding:24px}
.icon{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;color:var(--accent);font-size:1.6rem;box-shadow:0 0 0 1px var(--line)}
h1{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:2.6rem;line-height:1.15;margin:0}
p{color:var(--muted);margin:10px 0 0}
a{color:var(--accent);text-decoration:none;display:inline-block;margin-top:32px;font-size:.95rem;transition:transform .25s ease}
a:hover,a:focus-visible{transform:translateX(-3px)}
.a{opacity:0;animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i) * 110ms + 100ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.a{animation:none;opacity:1}}
</style>
</head>
<body>
<main>
<div class="icon a" style="--i:0"><i class="fa-solid fa-briefcase"></i></div>
<h1 class="a" style="--i:1">This page is being worked on!</h1>
<p class="a" style="--i:2">My freelance work will be here soon.</p>
<a class="a" style="--i:3" href="/">&larr; Back home</a>
</main>
</body>
</html>
