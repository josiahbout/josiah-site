<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Josiah</title>
<meta name="description" content="Josiah - 3D generalist and builder.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf8f5;--fg:#1c1b19;--muted:#77726b;--line:#e4dfd8;--accent:#b4532a}
@media (prefers-color-scheme:dark){:root{--bg:#141312;--fg:#ece8e1;--muted:#9a948b;--line:#2c2a27;--accent:#e08a5b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:96px 24px 80px}
header{text-align:center;margin-bottom:72px}
.avatar{width:128px;height:128px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 24px;box-shadow:0 0 0 4px var(--bg),0 0 0 5px var(--line)}
h1{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:3rem;line-height:1.1;margin:0}
.role{color:var(--muted);margin:8px 0 0;font-size:.95rem;letter-spacing:.02em}
h2{font-size:.75rem;text-transform:uppercase;letter-spacing:.16em;color:var(--muted);font-weight:500;margin:0 0 32px}
ol{list-style:none;margin:0;padding:0;position:relative}
ol::before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:1px;background:var(--line)}
li{position:relative;padding-left:36px;margin-bottom:36px}
li:last-child{margin-bottom:0}
li::before{content:"";position:absolute;left:0;top:5px;width:11px;height:11px;border-radius:50%;background:var(--bg);border:1px solid var(--muted)}
li:first-child::before{background:var(--accent);border-color:var(--accent)}
time{display:block;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.04em}
li p{margin:2px 0 0;font-size:1.1rem}
.accent{color:var(--accent)}
footer{margin-top:96px;text-align:center;font-size:.8rem;color:var(--muted)}
@media (max-width:480px){main{padding-top:64px}h1{font-size:2.4rem}}
</style>
</head>
<body>
<main>
<header>
<img class="avatar" src="https://github.com/josiahbout.png?size=256" alt="Josiah">
<h1>Josiah</h1>
<p class="role">3D Generalist &amp; Builder</p>
</header>
<section>
<h2>Timeline</h2>
<ol>
<li><time>2026</time><p>Building <span class="accent">@TheChubbitz</span></p></li>
<li><time>2025</time><p>Started freelancing</p></li>
<li><time>2021 &ndash; 2024</time><p>3D Generalist at ReelCaptivation Studio</p></li>
<li><time>2021</time><p>Graduated with a bachelor's in computer animation</p></li>
</ol>
</section>
<footer>&copy; 2026 Josiah</footer>
</main>
</body>
</html>
